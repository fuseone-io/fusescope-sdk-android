[versions]
# One upstream line: opentelemetry-android 1.7.0 is built on opentelemetry-java 1.65.0 and
# opentelemetry-java-instrumentation 2.31.1.
opentelemetry-android = "1.7.0"
opentelemetry-android-alpha = "1.7.0-alpha"
opentelemetry-instrumentation-alpha = "2.31.1-alpha"
kotlin = "2.4.10"
agp = "9.4.0"
compose-bom = "2026.09.00"
ktlint-plugin = "14.2.0"
ktlint-cli = "1.8.0"
license-report = "3.1.4"
maven-publish = "0.37.0"

[libraries]
otel-instrumentation-bom = { module = "io.opentelemetry.instrumentation:opentelemetry-instrumentation-bom-alpha", version.ref = "opentelemetry-instrumentation-alpha" }
otel-android-agent = { module = "io.opentelemetry.android:android-agent", version.ref = "opentelemetry-android" }
otel-android-core = { module = "io.opentelemetry.android:core", version.ref = "opentelemetry-android-alpha" }
otel-android-session = { module = "io.opentelemetry.android:session", version.ref = "opentelemetry-android" }
otel-android-common-api = { module = "io.opentelemetry.android.instrumentation:common-api", version.ref = "opentelemetry-android-alpha" }
otel-api = { module = "io.opentelemetry:opentelemetry-api" }
otel-sdk = { module = "io.opentelemetry:opentelemetry-sdk" }
otel-exporter-otlp = { module = "io.opentelemetry:opentelemetry-exporter-otlp" }
otel-sdk-testing = { module = "io.opentelemetry:opentelemetry-sdk-testing" }
otel-okhttp = { module = "io.opentelemetry.instrumentation:opentelemetry-okhttp-3.0" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version = "5.5.0" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver3", version = "5.5.0" }
otel-proto = { module = "io.opentelemetry.proto:opentelemetry-proto", version = "1.11.0-alpha" }
androidx-annotation = { module = "androidx.annotation:annotation", version = "1.10.0" }
androidx-fragment = { module = "androidx.fragment:fragment", version = "1.9.1" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version = "1.7.1" }
androidx-navigation-runtime = { module = "androidx.navigation:navigation-runtime", version = "2.9.5" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-runtime = { module = "androidx.compose.runtime:runtime" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version = "1.12.4" }
junit = { module = "junit:junit", version = "4.13.2" }
robolectric = { module = "org.robolectric:robolectric", version = "4.16.1" }
androidx-test-core = { module = "androidx.test:core", version = "1.7.0" }
androidx-test-runner = { module = "androidx.test:runner", version = "1.7.0" }
androidx-test-junit = { module = "androidx.test.ext:junit", version = "1.3.0" }
agp-api = { module = "com.android.tools.build:gradle-api", version.ref = "agp" }

[plugins]
android-library = { id = "com.android.library", version.ref = "agp" }
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint-plugin" }
license-report = { id = "com.github.jk1.dependency-license-report", version.ref = "license-report" }
maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "maven-publish" }
