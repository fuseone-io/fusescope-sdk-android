name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Lint (ktlint, Android lint)
        run: ./gradlew ktlintCheck lintRelease
      - name: Acceptance oracle checks
        run: python3 -m unittest discover -s scripts -p '*_test.py'
      - name: Unit tests
        run: ./gradlew testDebugUnitTest
      - name: Gradle plugin (lint, tests, validation)
        run: ./gradlew -p gradle-plugin ktlintCheck test validatePlugins
      - name: Licence check (runtime dependencies)
        run: ./gradlew checkLicense
      - name: Sample release build (R8)
        run: ./gradlew :sample:assembleRelease
      - name: Sample consumes published Maven artifacts
        run: |
          ./gradlew :sample:assembleDebug -Pfusescope.sample.sdkVersion=0.1.0-beta.3
          ./gradlew :sample:dependencies --configuration debugRuntimeClasspath -Pfusescope.sample.sdkVersion=0.1.0-beta.3 > published-sdk-dependencies.txt
          grep -F 'io.fuseone.fusescope:android:0.1.0-beta.3' published-sdk-dependencies.txt
          if grep -F 'project :sdk' published-sdk-dependencies.txt; then exit 1; fi
      - name: Validate aligned 1.0 candidate artifacts and isolated consumer
        env:
          ORG_GRADLE_PROJECT_VERSION_NAME: 1.0.0
        run: |
          candidate_repo="$RUNNER_TEMP/fusescope-candidate-maven"
          ./gradlew :sdk:publishToMavenLocal :compose:publishToMavenLocal -Dmaven.repo.local="$candidate_repo" --no-configuration-cache
          ./gradlew -p gradle-plugin publishToMavenLocal -Dmaven.repo.local="$candidate_repo" --no-configuration-cache
          python3 scripts/release_consumer.py --version 1.0.0 --repository "file://$candidate_repo"
      - uses: actions/upload-artifact@v4
        with:
          name: release-consumer-candidate
          path: |
            build/release-consumer/acceptance.json
            build/release-consumer/dependencies.txt
            build/release-consumer/buildEnvironment.txt
          if-no-files-found: error
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7

  instrumented:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: ./gradlew :sdk:assembleDebugAndroidTest :sample:assembleDebug
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install opentelemetry-proto==1.39.1
      - name: Smoke test on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          script: |
            ./gradlew :sdk:connectedDebugAndroidTest
            python scripts/native_smoke.py
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: sdk/build/reports/androidTests/
          retention-days: 7
