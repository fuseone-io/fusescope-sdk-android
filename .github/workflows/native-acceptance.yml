name: native-acceptance

on:
  workflow_dispatch:
    inputs:
      sdk_version:
        description: Published Maven SDK version
        required: true
        default: 0.1.0-beta.3
      full_acceptance:
        description: Also validate Android 1.0 sessions, consent, sampling, Compose, Java/ANR/R8 and Errors UI
        type: boolean
        required: false
        default: false
      backend_ref:
        description: Backend release tag or full commit SHA
        required: true
        default: v0.159.0-beta.2
      backend_image:
        description: Published backend image pinned by digest
        required: true
        default: ghcr.io/fuseone-io/fusescope@sha256:629df47b6d940d2644722dd7e9cad363db3da2b58f06faf2ee9d2c3d20cd2a18

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NATIVE_ACCEPTANCE_DIR: ${{ github.workspace }}/build/native-acceptance
      NATIVE_SCREENSHOT: ${{ github.workspace }}/build/native-acceptance/evidence/errors-native.png
      FULL_ACCEPTANCE: ${{ inputs.full_acceptance }}
      SDK_VERSION: ${{ inputs.sdk_version }}
      BACKEND_IMAGE: ${{ inputs.backend_image }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: fuseone-io/fusescope
          ref: ${{ inputs.backend_ref }}
          path: backend
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: gradle/actions/setup-gradle@v4
      - uses: astral-sh/setup-uv@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Free disk for backend and emulator
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Install backend test dependencies
        working-directory: backend/tests
        run: uv sync --frozen
      - name: Verify published backend image matches source
        run: |
          docker pull "$BACKEND_IMAGE"
          expected=$(git -C backend rev-parse HEAD)
          actual=$(docker image inspect "$BACKEND_IMAGE" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')
          test "$actual" = "$expected"
      - name: Prepare real backend and collector
        run: |
          mkdir -p "$NATIVE_ACCEPTANCE_DIR/evidence"
          cp scripts/native_acceptance_setup.py backend/tests/integration/tests/rum/99_native_acceptance_setup.py
          python - <<'PYCONFIG'
          from pathlib import Path
          p = Path("backend/tests/integration/tests/rum/conftest.py")
          marker = '"SIGNOZ_RUM_ENABLED": True,'
          source = p.read_text()
          assert marker in source
          # The negative-test fixture uses tiny artifact quotas. Acceptance uses production defaults.
          source = "\n".join(line for line in source.splitlines() if '"SIGNOZ_RUM_SOURCEMAPS_' not in line) + "\n"
          # The published image serves /etc/signoz/web; the source-build fixture uses /root/web.
          p.write_text(source.replace(marker, '"SIGNOZ_WEB_DIRECTORY": "/etc/signoz/web", ' + marker, 1))
          PYCONFIG
          cd backend/tests
          uv run pytest --basetemp=./tmp -vv --reuse --with-web --signoz-image "$BACKEND_IMAGE" integration/tests/rum/99_native_acceptance_setup.py
      - name: Build sample against published SDK
        run: python scripts/native_acceptance.py build --config "$NATIVE_ACCEPTANCE_DIR/private.json" --sdk-version "$SDK_VERSION"
      - name: Build complete Android acceptance scenarios
        if: inputs.full_acceptance
        run: python scripts/android_acceptance.py build --config "$NATIVE_ACCEPTANCE_DIR/private.json" --sdk-version "$SDK_VERSION"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Native crash reaches real FuseScope
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          script: |
            python scripts/native_acceptance.py verify --config "$NATIVE_ACCEPTANCE_DIR/private.json" --sdk-version "$SDK_VERSION"
            if [ "$FULL_ACCEPTANCE" = "true" ]; then python scripts/android_acceptance.py verify --config "$NATIVE_ACCEPTANCE_DIR/private.json" --sdk-version "$SDK_VERSION"; fi
      - name: Verify Errors UI
        run: |
          cp "$NATIVE_ACCEPTANCE_DIR/.env.local" backend/tests/e2e/.env.local
          cp scripts/native_acceptance.spec.ts backend/tests/e2e/tests/rum/native-release.spec.ts
          if [ "$FULL_ACCEPTANCE" = "true" ]; then cp scripts/android_acceptance.spec.ts backend/tests/e2e/tests/rum/android-release.spec.ts; fi
          cd backend/tests/e2e
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
          pnpm exec playwright test tests/rum/native-release.spec.ts --project=chromium --no-deps --workers=1
          if [ "$FULL_ACCEPTANCE" = "true" ]; then pnpm exec playwright test tests/rum/android-release.spec.ts --project=chromium --no-deps --workers=1; fi
      - name: Record source versions
        if: always()
        run: |
          mkdir -p "$NATIVE_ACCEPTANCE_DIR/evidence"
          { echo "sdk_version=$SDK_VERSION"; echo "acceptance_source=$(git rev-parse HEAD)"; echo "backend_source=$(git -C backend rev-parse HEAD)"; echo "backend_image=$BACKEND_IMAGE"; } > "$NATIVE_ACCEPTANCE_DIR/evidence/versions.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-release-acceptance
          path: build/native-acceptance/evidence/
          retention-days: 30
